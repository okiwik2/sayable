<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe6dc" />
    <meta name="description" content="Sayable: talk with words, symbols and sign. Works offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sayable" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Sayable</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Sayable needs JavaScript to run.</noscript>
    <script>
      // If the app fails to start (e.g. on an old iPad), show why instead of a blank page.
      window.onerror = function (msg, src, line, col) {
        var root = document.getElementById('root');
        if (!root || root.children.length) return;
        var p = document.createElement('pre');
        p.style.cssText = 'white-space:pre-wrap;padding:16px;font:14px monospace;color:#900';
        p.textContent = 'Sayable could not start:\n' + msg + '\n' + (src || '') + ':' + line + ':' + col;
        root.appendChild(p);
      };
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
